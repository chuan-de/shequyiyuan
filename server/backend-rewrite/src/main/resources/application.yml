spring:
  application:
    name: hospital-backend-rewrite
  # Spring AI 1.0 starter is on the classpath but Phase 0 does NOT use its
  # auto-wired ChatModel / EmbeddingModel beans — we own the HTTP call via
  # AiCallTemplate (forces temperature=1, custom retry, audit-friendly). These
  # flags disable the model auto-config so a missing OPENAI key never breaks
  # boot. Phase 2 will revisit if/when we adopt Spring AI's VectorStore.
  ai:
    # We do NOT use Spring AI's auto-wired model beans — AiCallTemplate owns the
    # HTTP path (forces temperature=1, custom retry, audit-friendly). Disable
    # every OpenAI model category so a missing OPENAI key never breaks boot.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      # Spring AI's OpenAI starter still requires *some* key value during property
      # binding even when the model beans are disabled. Provide a harmless
      # placeholder; we never actually call OpenAI through this starter.
      api-key: ${SPRING_AI_OPENAI_API_KEY:disabled-placeholder}
  datasource:
    url: jdbc:postgresql://localhost:5432/hospital
    username: hospital
    password: hospital
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

security:
  jwt:
    # 开发占位密钥。生产以 prod profile 启动时改由 HOSPITAL_JWT_SECRET 强制注入
    # （application-prod.yml 中无默认值，缺失即启动失败），不会带着占位符上线。
    secret: ${HOSPITAL_JWT_SECRET:replace-with-a-32-byte-minimum-secret-key}
    access-token-ttl: 8h
  # 登录失败限流（按 用户名+来源IP 计数，内存实现，单实例有效）
  login-throttle:
    max-attempts: 5
    lock-duration: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: 8089

# AI features (Phase 0 — infrastructure only).
# The provider is Volcengine Ark (Doubao) via OpenAI-compatible endpoint.
# API key MUST be supplied via env HOSPITAL_AI_API_KEY (never commit a real key).
# Toggle hospital.ai.enabled=false in environments without an API key to skip
# the AI bean graph entirely so the rest of the app stays healthy.
hospital:
  ai:
    enabled: true
    provider: doubao
    base-url: https://ark.cn-beijing.volces.com/api/v3
    api-key: ${HOSPITAL_AI_API_KEY:}
    chat-model: doubao-seed-2.0-lite
    # doubao-embedding-vision-250615 is the embedding model whitelisted on
    # Volcano agentPlan. It returns 2048-dim vectors (V44 widened the column
    # to match). doubao-embedding-text-* models (1024 dim) require a
    # commercial-tier key and a corresponding embedding-dimension override.
    embedding-model: doubao-embedding-vision-250615
    embedding-dimension: 2048
    vision-model: doubao-seed-2.0-lite
    timeout-seconds: 60
    features:
      vision: true
      patient-rag: true
      consult: true
    rate-limit:
      per-user-qpm: 10
      daily-token-budget: 100000
  # Qdrant vector store (Phase 2 RAG). Created automatically at boot if the
  # collection does not yet exist — see com.hospital.ai.qdrant.QdrantBootstrap.
  # vector-size MUST equal hospital.ai.embedding-dimension.
  qdrant:
    host: localhost
    port: 6334            # gRPC; REST is 6333 (handy for curl, not used here)
    use-tls: false
    api-key: ${HOSPITAL_QDRANT_API_KEY:}   # empty for local; required in prod
    collection: patient_knowledge
    vector-size: 2048
    distance: Cosine
