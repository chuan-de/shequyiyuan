spring:
  application:
    name: hospital-backend-rewrite
  datasource:
    url: jdbc:postgresql://localhost:5432/hospital
    username: hospital
    password: hospital
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

security:
  jwt:
    secret: replace-with-a-32-byte-minimum-secret-key
    access-token-ttl: 8h

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: 8089
