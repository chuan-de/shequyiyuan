spring:
  application:
    name: hospital-backend-rewrite
  datasource:
    url: jdbc:postgresql://localhost:5432/hospital
    username: hospital
    password: hospital
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: replace-with-a-32-byte-minimum-secret-key
    access-token-ttl: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

observability:
  alert-thresholds:
    p95-latency-ms: 500
    error-rate: 0.05

server:
  port: 8080
