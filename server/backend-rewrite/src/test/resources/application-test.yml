spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

security:
  jwt:
    secret: test-secret-key-test-secret-key-32bytes
    access-token-ttl: 1h

# AI infrastructure stays off in tests — no real API key, no real upstream.
# Individual tests can override hospital.ai.enabled=true via @TestPropertySource.
hospital:
  ai:
    enabled: false
    api-key: ""
