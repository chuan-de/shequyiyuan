# 生产编排：docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# 变量清单见 .env.prod.example；部署步骤见 docs/deployment.md。
# 与开发用 docker-compose.yml 互不影响（卷名、端口均独立）。
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: ${HOSPITAL_DB_PASSWORD:?请在 .env.prod 设置 HOSPITAL_DB_PASSWORD}
    volumes:
      - hospital_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospital"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    # 数据库不对宿主机暴露端口，仅 compose 网络内可达

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - hospital_qdrant_prod:/qdrant/storage
    restart: unless-stopped

  backend:
    build: ./server/backend-rewrite
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_PASSWORD: ${HOSPITAL_DB_PASSWORD:?请在 .env.prod 设置 HOSPITAL_DB_PASSWORD}
      HOSPITAL_JWT_SECRET: ${HOSPITAL_JWT_SECRET:?请在 .env.prod 设置 HOSPITAL_JWT_SECRET（≥32字节）}
      HOSPITAL_AI_ENABLED: ${HOSPITAL_AI_ENABLED:-false}
      HOSPITAL_AI_API_KEY: ${HOSPITAL_AI_API_KEY:-}
      HOSPITAL_QDRANT_API_KEY: ${HOSPITAL_QDRANT_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # 浏览器访问后端用的对外地址（构建期内联），如 https://api.example.com
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?请在 .env.prod 设置 NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hospital_pgdata_prod:
  hospital_qdrant_prod:
