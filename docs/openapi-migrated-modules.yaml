openapi: 3.0.3
info:
  title: Shequyiyuan Migrated Modules API
  version: 1.1.0
  description: |
    覆盖当前已迁移模块（认证、健康检查、字典）的请求参数、响应结构与标准错误码。
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      tags: [health]
      summary: 健康检查
      operationId: healthCheck
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeHealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: 注册
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeAuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 当前用户信息
      operationId: currentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeCurrentUserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/dictionaries:
    get:
      tags: [dictionary]
      summary: 查询字典分组
      operationId: listDictionaries
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DictionaryGroupResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/dictionaries/{dictionaryCode}/items:
    get:
      tags: [dictionary]
      summary: 查询字典项
      operationId: listDictionaryItems
      security:
        - bearerAuth: []
      parameters:
        - name: dictionaryCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DictionaryItemResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/medications:
    get:
      tags: [medication]
      summary: 药品列表
      security: [{ bearerAuth: [] }]
      responses: {'200': {description: 查询成功}}
    post:
      tags: [medication]
      summary: 新增药品
      security: [{ bearerAuth: [] }]
      responses: {'200': {description: 新增成功}, '400': {$ref: '#/components/responses/ValidationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}}
  /api/v1/medications/{id}:
    get: {tags: [medication], summary: 药品详情, security: [{ bearerAuth: [] }], responses: {'200': {description: 查询成功}, '404': {$ref: '#/components/responses/NotFoundError'}}}
    put: {tags: [medication], summary: 编辑药品, security: [{ bearerAuth: [] }], responses: {'200': {description: 更新成功}}}
  /api/v1/medications/{id}/status:
    patch: {tags: [medication], summary: 药品状态变更, security: [{ bearerAuth: [] }], responses: {'200': {description: 状态变更成功}}}
  /api/v1/family-doctors:
    get: {tags: [familyDoctor], summary: 家庭医生签约列表, security: [{ bearerAuth: [] }], responses: {'200': {description: 查询成功}}}
    post: {tags: [familyDoctor], summary: 新增签约, security: [{ bearerAuth: [] }], responses: {'200': {description: 新增成功}}}
  /api/v1/family-doctors/{id}:
    get: {tags: [familyDoctor], summary: 签约详情, security: [{ bearerAuth: [] }], responses: {'200': {description: 查询成功}}}
    put: {tags: [familyDoctor], summary: 编辑签约, security: [{ bearerAuth: [] }], responses: {'200': {description: 更新成功}}}
  /api/v1/family-doctors/{id}/status:
    patch: {tags: [familyDoctor], summary: 签约状态变更, security: [{ bearerAuth: [] }], responses: {'200': {description: 状态变更成功}}}
  /api/v1/configs:
    get: {tags: [config], summary: 配置列表, security: [{ bearerAuth: [] }], responses: {'200': {description: 查询成功}}}
    post: {tags: [config], summary: 新增配置, security: [{ bearerAuth: [] }], responses: {'200': {description: 新增成功}}}
  /api/v1/configs/{id}:
    get: {tags: [config], summary: 配置详情, security: [{ bearerAuth: [] }], responses: {'200': {description: 查询成功}}}
    put: {tags: [config], summary: 编辑配置, security: [{ bearerAuth: [] }], responses: {'200': {description: 更新成功}}}
  /api/v1/configs/{id}/status:
    patch: {tags: [config], summary: 配置状态变更, security: [{ bearerAuth: [] }], responses: {'200': {description: 状态变更成功}}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresInSeconds]
      properties:
        accessToken: { type: string }
        tokenType: { type: string }
        expiresInSeconds: { type: integer, format: int64 }
    CurrentUserResponse:
      type: object
      required: [username, enabled, roles, permissions]
      properties:
        username: { type: string }
        enabled: { type: boolean }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
    DictionaryGroupResponse:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    DictionaryItemResponse:
      type: object
      required: [id, name, value, sortOrder, enabled]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        value: { type: string }
        sortOrder: { type: integer, format: int32 }
        enabled: { type: boolean }
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status: { type: string }
        service: { type: string }
        timestamp: { type: string, format: date-time }
    ApiEnvelopeAuthResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/AuthResponse' }
    ApiEnvelopeCurrentUserResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/CurrentUserResponse' }
    ApiEnvelopeHealthResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/HealthResponse' }
    ApiEnvelopeObject:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: object
          additionalProperties: true
    ApiErrorResponse:
      type: object
      properties:
        message: { type: string }
        errorCode:
          type: string
          enum: [VALIDATION_ERROR, CONFLICT, INTERNAL_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND]
        details:
          type: array
          items: { type: string }
        traceId: { type: string }
  responses:
    ValidationError:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    ConflictError:
      description: 资源冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    UnauthorizedError:
      description: 未认证或 token 无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    ForbiddenError:
      description: 无权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    NotFoundError:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    InternalError:
      description: 服务内部错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
