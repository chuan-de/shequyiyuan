spring:
  application:
    name: hospital-backend-rewrite
  datasource:
    url: jdbc:postgresql://localhost:5432/hospital
    username: hospital
    password: hospital
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: 8080
